<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon & PWA -->
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevOps Todo" />
    <meta property="og:url" content="https://todo.wsnsam.my.id/" />
    <meta
      property="og:title"
      content="DevOps Todo – Plan, Track, Ship Faster"
    />
    <meta
      property="og:description"
      content="A modern DevOps-focused task manager built for engineers who ship."
    />
    <meta
      property="og:image"
      content="https://todo.wsnsam.my.id/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Primary Meta -->
    <title>DevOps Todo – Plan, Track, Ship Faster</title>
    <meta
      name="description"
      content="A modern DevOps-focused task manager to plan, track, and ship faster — with clean workflows and zero clutter."
    />
    <meta
      name="keywords"
      content="devops, todo, task management, kanban, productivity, react, vite"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://todo.wsnsam.my.id/" />
    <meta
      name="twitter:title"
      content="DevOps Todo – Plan, Track, Ship Faster"
    />
    <meta
      name="twitter:description"
      content="A modern DevOps-focused task manager built for engineers who ship."
    />
    <meta
      name="twitter:image"
      content="https://todo.wsnsam.my.id/og-image.jpg"
    />

    <!-- Decorative background (aesthetic only; doesn't affect app interaction) -->
    <style>
      :root{
        --bg-start: #07132a;
        --bg-mid: #0f172a;
        --bg-end: #112240;
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-mid) 40%, var(--bg-end) 100%);
        background-attachment: fixed;
        color-scheme: dark;
        overflow-x: hidden;
      }

      /* Decorative SVG container sits beneath the app; pointer-events disabled so it never interferes */
      .decorative {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .decorative svg { width: 100%; height: 100%; display: block; }

      .blob {
        mix-blend-mode: screen;
        opacity: 0.12;
        filter: blur(60px);
        transform-origin: center;
      }

      /* Ensure app is above the decoration so nothing changes functionally */
      #app { position: relative; z-index: 1; }

      /* Gentle float animation; disabled for users who prefer reduced motion */
      @media (prefers-reduced-motion: no-preference) {
        .blob { animation: float 12s ease-in-out infinite; }
        .blob.b2 { animation-duration: 18s; transform-origin: 30% 30%; }
      }

      @keyframes float {
        0% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
        100% { transform: translateY(0) scale(1); }
      }
    </style>
  </head>

  <body>
    <!-- Decorative, aria-hidden background element — purely aesthetic -->
    <div class="decorative" aria-hidden="true">
      <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#00b4d8" />
            <stop offset="50%" stop-color="#7b2ff7" />
            <stop offset="100%" stop-color="#ff6b6b" />
          </linearGradient>
        </defs>

        <g transform="translate(0,0)">
          <ellipse class="blob b1" cx="200" cy="140" rx="260" ry="120" fill="url(#g1)"></ellipse>
          <ellipse class="blob b2" cx="600" cy="420" rx="240" ry="140" fill="#1e3a8a"></ellipse>
        </g>
      </svg>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
