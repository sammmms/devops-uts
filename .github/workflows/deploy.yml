name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: SSH into VPS and deploy latest images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ~/devops-uts
            git pull origin main
            podman-compose down --remove-orphans
            podman pull docker.io/wsnsam/devops-uts_backend:latest
            podman pull docker.io/wsnsam/devops-uts_frontend:latest
            podman-compose up -d --replace
