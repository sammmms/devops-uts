name: CI/CD Pipeline with Build & Deploy

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build Backend Image
        run: |
          cd backend
          podman build --platform linux/amd64 -t docker.io/wsnsam/devops-uts_backend .
          podman push docker.io/wsnsam/devops-uts_backend

      - name: 🏗️ Build Frontend Image
        run: |
          cd frontend
          podman build --platform linux/amd64 -t docker.io/wsnsam/devops-uts_frontend .
          podman push docker.io/wsnsam/devops-uts_frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd ~/compose-conf

            echo "🧹 Stopping old containers..."
            podman-compose down || true

            echo "📦 Pulling latest images..."
            podman pull docker.io/wsnsam/devops-uts_backend
            podman pull docker.io/wsnsam/devops-uts_frontend

            echo "🚢 Starting new containers..."
            podman-compose up -d

            echo "✅ Deployment complete!"
