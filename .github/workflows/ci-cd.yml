name: CI/CD Pipeline with Build & Deploy

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build Backend Image
        run: |
          cd backend
          podman build --platform linux/amd64 -t docker.io/wsnsam/devops-uts_backend .
          podman push docker.io/wsnsam/devops-uts_backend

      - name: ⚡️ Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 🏗️ Build Frontend Image
        run: |
          cd frontend
          podman build --platform linux/amd64 -t docker.io/wsnsam/devops-uts_frontend .
          podman push docker.io/wsnsam/devops-uts_frontend

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4

      - name: 📂 Copy Manifests to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "k8s/"
          target: "~/"

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e

            echo "📦 Applying Kubernetes manifests..."
            sudo k3s kubectl apply -f ~/k8s --wait=false

            echo "♻️ Restarting deployments..."
            sudo k3s kubectl rollout restart deployment backend frontend

            echo "✅ Kubernetes deployment triggered!"
